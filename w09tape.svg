<?xml version="1.0" encoding="UTF-8"?>
<svg width="1014" height="387" viewBox="0 0 780 298" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    text  { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 13px; fill: #111; }
    .ttl  { font-size: 14px; font-weight: bold; }
    .lbl  { font-size: 11px; fill: #555; font-style: italic; }
    .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 12px; fill: #222; }
    .sym  { font-family: "DejaVu Sans Mono", monospace; font-size: 17px; }
    .cn   { fill: #D6EAF8; stroke: #2471A3; stroke-width: 1.8; }  /* normal cell */
    .cf   { fill: #F9CA74; stroke: #D35400; stroke-width: 2.5; }  /* focus cell  */
    .dim  { fill: #999; }
    .brace { stroke: #2471A3; stroke-width: 1.2; fill: none; }
    .op   { stroke: #27AE60; stroke-width: 2; fill: none; }
  </style>
  <marker id="dn" markerWidth="7" markerHeight="6" refX="3.5" refY="0" orient="auto">
    <polygon points="0 0, 7 0, 3.5 6" fill="#555"/>
  </marker>
</defs>

<rect width="780" height="298" fill="white" stroke="#ddd"/>

<!-- Title -->
<text class="ttl" x="340" y="21" text-anchor="middle">Suwak dla listy: Tape = (h, ls, rs)</text>
<text class="lbl" x="340" y="36" text-anchor="middle">
  type Tape = (Symbol, [Symbol], [Symbol])  —  bieżący, lewa (odwrócona), prawa
</text>

<!-- ════════════════════ ROW 1  ('c', ['b','a'], ['d','e']) ════════════════════ -->

<text class="mono" x="28" y="68">('c', ['b','a'], ['d','e'])</text>

<!-- tape  cells: centers at x = 180 248 316 384 452 -->
<text class="dim" x="118" y="98" font-size="15">···</text>

<rect class="cn" x="150" y="72" width="60" height="44" rx="4"/>
<text class="sym" x="180" y="102" text-anchor="middle">'a'</text>

<rect class="cn" x="218" y="72" width="60" height="44" rx="4"/>
<text class="sym" x="248" y="102" text-anchor="middle">'b'</text>

<!-- focus -->
<rect class="cf" x="286" y="67" width="60" height="54" rx="4"/>
<text class="sym" x="316" y="102" text-anchor="middle" font-weight="bold">'c'</text>

<rect class="cn" x="354" y="72" width="60" height="44" rx="4"/>
<text class="sym" x="384" y="102" text-anchor="middle">'d'</text>

<rect class="cn" x="422" y="72" width="60" height="44" rx="4"/>
<text class="sym" x="452" y="102" text-anchor="middle">'e'</text>

<text class="dim" x="492" y="98" font-size="15">···</text>

<!-- region labels row 1 -->
<path class="brace" d="M152,122 v4 h124 v-4"/>
<text class="lbl" x="214" y="138" text-anchor="middle" fill="#1A5276">ls = ['b','a']  ← głowa listy sąsiaduje z h</text>

<path class="brace" d="M356,122 v4 h124 v-4"/>
<text class="lbl" x="418" y="138" text-anchor="middle" fill="#1A5276">rs = ['d','e']</text>

<text class="lbl" x="316" y="140" text-anchor="middle" fill="#C05000">h</text>

<!-- ════════════════════ left arrow ════════════════════ -->

<line stroke="#555" stroke-width="1.8" x1="316" y1="148" x2="316" y2="166" marker-end="url(#dn)"/>
<text class="mono" x="326" y="161" fill="#1E8449">left (h, l:ls, rs) = (l, ls, h:rs)</text>

<!-- ════════════════════ ROW 2  ('b', ['a'], ['c','d','e']) ════════════════════ -->

<text class="mono" x="28" y="188">('b', ['a'], ['c','d','e'])</text>

<text class="dim" x="118" y="217" font-size="15">···</text>

<rect class="cn" x="150" y="192" width="60" height="44" rx="4"/>
<text class="sym" x="180" y="221" text-anchor="middle">'a'</text>

<!-- focus shifted left -->
<rect class="cf" x="218" y="187" width="60" height="54" rx="4"/>
<text class="sym" x="248" y="221" text-anchor="middle" font-weight="bold">'b'</text>

<rect class="cn" x="286" y="192" width="60" height="44" rx="4"/>
<text class="sym" x="316" y="221" text-anchor="middle">'c'</text>

<rect class="cn" x="354" y="192" width="60" height="44" rx="4"/>
<text class="sym" x="384" y="221" text-anchor="middle">'d'</text>

<rect class="cn" x="422" y="192" width="60" height="44" rx="4"/>
<text class="sym" x="452" y="221" text-anchor="middle">'e'</text>

<text class="dim" x="492" y="217" font-size="15">···</text>

<!-- region labels row 2 -->
<path class="brace" d="M152,242 v4 h60  v-4"/>
<text class="lbl" x="182" y="257" text-anchor="middle" fill="#1A5276">ls=['a']</text>

<path class="brace" d="M288,242 v4 h192 v-4"/>
<text class="lbl" x="384" y="257" text-anchor="middle" fill="#1A5276">rs = ['c','d','e']</text>

<text class="lbl" x="248" y="258" text-anchor="middle" fill="#C05000">h</text>

<!-- ════════════════════ bottom code box ════════════════════ -->

<rect fill="#F8F9FA" stroke="#DDD" stroke-width="1" x="28" y="267" width="724" height="26" rx="4"/>
<text class="mono" x="36" y="284">right (h, ls, r:rs) = (r, h:ls, rs)   — O(1)</text>
<text class="mono" x="360" y="284">modifyHere f (h, ls, rs) = (f h, ls, rs)   — O(1)</text>

</svg>
