<?xml version="1.0" encoding="UTF-8"?>
<svg width="936" height="364" viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    text  { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 12px; fill: #111; }
    .ttl  { font-size: 13px; font-weight: bold; }
    .step { font-size: 11px; font-weight: bold; fill: #1A5276; }
    .sub  { font-size: 10px; font-style: italic; fill: #666; }
    .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 12px; fill: #222; }
    .c-inp  { fill: #ECF0F1; stroke: #7F8C8D; stroke-width: 1.5; }
    .c-endo { fill: #D7BDE2; stroke: #7D3C98; stroke-width: 2; }
    .c-z    { fill: #AED6F1; stroke: #2471A3; stroke-width: 1.5; }
    .c-res  { fill: #A9DFBF; stroke: #1E8449; stroke-width: 2; }
    .edge   { stroke: #555; stroke-width: 1.5; }
    .pe     { stroke: #7D3C98; stroke-width: 1.5; }
  </style>
  <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#555"/>
  </marker>
  <marker id="parr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#7D3C98"/>
  </marker>
  <marker id="pdn" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
    <polygon points="0 0, 6 2.5, 0 5" fill="#7D3C98"/>
  </marker>
</defs>

<rect width="720" height="280" fill="white" stroke="#ddd"/>

<!-- Title -->
<text class="ttl" x="360" y="16" text-anchor="middle">foldr f z t = appEndo (foldMap (Endo . f) t) z</text>
<text class="sub"  x="360" y="28" text-anchor="middle">Przykład: foldr (+) 0 [1, 2, 3] = 6</text>

<!-- ══════════════════════════════════════════════
     STEP 1: each element x  →  Endo (f x) = Endo (x+)
     ══════════════════════════════════════════════ -->
<text class="step" x="18" y="44">1.</text>
<text class="step" x="32" y="44">Każdy element x mapowany na Endo (f x) = Endo (x+)</text>

<!-- Input cells -->
<rect class="c-inp" x="210" y="50" width="44" height="26" rx="4"/>
<text x="232" y="68" text-anchor="middle" font-size="14" font-weight="bold">1</text>

<rect class="c-inp" x="338" y="50" width="44" height="26" rx="4"/>
<text x="360" y="68" text-anchor="middle" font-size="14" font-weight="bold">2</text>

<rect class="c-inp" x="466" y="50" width="44" height="26" rx="4"/>
<text x="488" y="68" text-anchor="middle" font-size="14" font-weight="bold">3</text>

<!-- Down arrows labelled Endo.(+) -->
<line class="pe" x1="232" y1="76" x2="232" y2="91" marker-end="url(#pdn)"/>
<line class="pe" x1="360" y1="76" x2="360" y2="91" marker-end="url(#pdn)"/>
<line class="pe" x1="488" y1="76" x2="488" y2="91" marker-end="url(#pdn)"/>
<text class="sub" x="360" y="88" text-anchor="middle" fill="#7D3C98">Endo . (+)</text>

<!-- Endo function boxes, with <> between them -->
<rect class="c-endo" x="202" y="95" width="60" height="28" rx="4"/>
<text x="232" y="114" text-anchor="middle" font-size="12">Endo(1+)</text>

<text x="296" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#7D3C98">&lt;&gt;</text>

<rect class="c-endo" x="330" y="95" width="60" height="28" rx="4"/>
<text x="360" y="114" text-anchor="middle" font-size="12">Endo(2+)</text>

<text x="424" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#7D3C98">&lt;&gt;</text>

<rect class="c-endo" x="458" y="95" width="60" height="28" rx="4"/>
<text x="488" y="114" text-anchor="middle" font-size="12">Endo(3+)</text>

<!-- ══════════════════════════════════════════════
     STEP 2: foldMap combines via <> = composition
     ══════════════════════════════════════════════ -->
<text class="step" x="18" y="144">2.</text>
<text class="step" x="32" y="144">foldMap składa przez &lt;&gt; — dla Endo jest to złożenie funkcji</text>

<!-- Down arrow to composition result -->
<line class="pe" x1="360" y1="127" x2="360" y2="149" marker-end="url(#pdn)"/>

<!-- Composition result box -->
<rect class="c-endo" x="185" y="151" width="350" height="28" rx="4"/>
<text x="360" y="170" text-anchor="middle" font-size="12">Endo ((1+) . (2+) . (3+))</text>

<!-- ══════════════════════════════════════════════
     STEP 3: appEndo applies composed fn to z=0
     ══════════════════════════════════════════════ -->
<text class="step" x="18" y="198">3.</text>
<text class="step" x="32" y="198">appEndo stosuje złożoną funkcję do z = 0</text>
<text class="sub"  x="32" y="210">(prawy element stosowany pierwszy — własność foldr)</text>

<!-- Pipeline: z=0 → (3+)→3 → (2+)→5 → (1+)→6 -->

<rect class="c-z"   x="118" y="216" width="58" height="30" rx="4"/>
<text x="147" y="236" text-anchor="middle" font-size="12">z = 0</text>

<line class="edge" x1="176" y1="231" x2="205" y2="231" marker-end="url(#arr)"/>

<rect class="c-endo" x="207" y="216" width="64" height="30" rx="4"/>
<text x="239" y="236" text-anchor="middle" font-size="12">(3+)</text>
<text class="sub" x="239" y="254" text-anchor="middle">3+0 = 3</text>

<line class="edge" x1="271" y1="231" x2="300" y2="231" marker-end="url(#arr)"/>

<rect class="c-endo" x="302" y="216" width="64" height="30" rx="4"/>
<text x="334" y="236" text-anchor="middle" font-size="12">(2+)</text>
<text class="sub" x="334" y="254" text-anchor="middle">2+3 = 5</text>

<line class="edge" x1="366" y1="231" x2="395" y2="231" marker-end="url(#arr)"/>

<rect class="c-endo" x="397" y="216" width="64" height="30" rx="4"/>
<text x="429" y="236" text-anchor="middle" font-size="12">(1+)</text>
<text class="sub" x="429" y="254" text-anchor="middle">1+5 = 6</text>

<line class="edge" x1="461" y1="231" x2="490" y2="231" marker-end="url(#arr)"/>

<rect class="c-res" x="492" y="216" width="58" height="30" rx="4"/>
<text x="521" y="236" text-anchor="middle" font-size="14" font-weight="bold">6</text>

<!-- Code -->
<rect fill="#F8F9FA" stroke="#DDD" stroke-width="1" x="18" y="262" width="684" height="14" rx="3"/>
<text class="mono" x="360" y="273" text-anchor="middle" font-size="10">
  Endo f &lt;&gt; Endo g  =  Endo (f . g)     mempty  =  Endo id
</text>

</svg>
