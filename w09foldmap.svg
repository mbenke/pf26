<text class="sub" x="640" y="255" text-anchor="middle">= f 4</text>

<!-- ══════════════ CODE FOOTER ══════════════ -->
<rect fill="#F8F9FA" stroke="#DDD" stroke-width="1" x="25" y="264" width="650" height="34" rx="4"/>
<text class="mono" x="35" y="279">foldMap f (Tip x)   = f x                       -- f do każdego liścia</text>
<text class="mono" x="35" y="293">foldMap f (Bin l r) = foldMap f l &lt;&gt; foldMap f r  -- składaj od dołu</text>

