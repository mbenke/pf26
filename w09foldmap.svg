<?xml version="1.0" encoding="UTF-8"?>
<svg width="910" height="397" viewBox="0 0 700 305" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    text  { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 12px; fill: #111; }
    .ttl  { font-size: 13px; font-weight: bold; }
    .sub  { font-size: 10px; font-style: italic; fill: #666; }
    .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 11px; fill: #222; }
    .c-bin { fill: #AED6F1; stroke: #2471A3; stroke-width: 1.8; }
    .c-tip { fill: #A9DFBF; stroke: #1E8449; stroke-width: 1.5; }
    .c-op  { fill: #FAD7A0; stroke: #E67E22; stroke-width: 2; }
    .edge  { stroke: #555; stroke-width: 1.5; }
  </style>
</defs>

<rect width="700" height="305" fill="white" stroke="#ddd"/>

<!-- Title -->
<text class="ttl" x="350" y="18" text-anchor="middle">foldMap — mapuj każdy liść przez f, składaj wyniki przez &lt;&gt;</text>
<text class="sub"  x="350" y="30" text-anchor="middle">etree4 = Bin (Bin (Tip 1) (Tip 2)) (Bin (Tip 3) (Tip 4))</text>

<!-- Column headers -->
<text class="sub" x="175" y="44" text-anchor="middle">ETree Int (wejście)</text>
<text class="sub" x="530" y="44" text-anchor="middle">foldMap Sum — wartość w każdym węźle</text>

