<?xml version="1.0" encoding="UTF-8"?>
<svg width="936" height="367" viewBox="0 0 720 282" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    text  { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 13px; fill: #111; }
    .ttl  { font-size: 15px; font-weight: bold; }
    .sub  { font-size: 11px; font-style: italic; fill: #666; }
    .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 13px; }
    .ann  { font-family: "DejaVu Sans Mono", monospace; font-size: 12px; font-weight: bold; }
    .b-inp  { fill: #F2F3F4; stroke: #7F8C8D; stroke-width: 1.5; }
    .b-list { fill: #EBF5FB; stroke: #2471A3; stroke-width: 2; }
    .b-just { fill: #D5F5E3; stroke: #1E8449; stroke-width: 2; }
    .b-noth { fill: #FADBD8; stroke: #C0392B; stroke-width: 2; }
    .div  { stroke: #CCC; stroke-width: 1; stroke-dasharray: 5,4; }
    .sep  { stroke: #E0E0E0; stroke-width: 1; }
  </style>
</defs>

<rect width="720" height="282" fill="white" stroke="#ddd"/>

<!-- Title -->
<text class="ttl" x="360" y="22" text-anchor="middle">fmap g  vs  traverse g</text>
<text class="sub" x="360" y="36" text-anchor="middle">
  g :: a → f b    |    fmap g :: t a → t (f b)    |    traverse g :: t a → f (t b)
</text>

<!-- Column headers -->
<text class="ttl" x="180" y="54" text-anchor="middle" fill="#1A5276">fmap dec</text>
<text class="sub" x="180" y="66" text-anchor="middle">[Int] → [Maybe Int]</text>
<text class="ttl" x="540" y="54" text-anchor="middle" fill="#1A5276">traverse dec</text>
<text class="sub" x="540" y="66" text-anchor="middle">[Int] → Maybe [Int]</text>

<!-- Divider -->
<line class="div" x1="360" y1="43" x2="360" y2="274"/>

<!-- ══ SUCCESS: dec applied to [1, 2, 3] ══ -->

<!-- Inputs -->
<rect class="b-inp" x="40"  y="72" width="280" height="30" rx="4"/>
<text class="mono" x="180" y="92" text-anchor="middle">[ 1, 2, 3 ]</text>

<rect class="b-inp" x="400" y="72" width="280" height="30" rx="4"/>
<text class="mono" x="540" y="92" text-anchor="middle">[ 1, 2, 3 ]</text>

<!-- Arrows + labels -->
<line stroke="#888" stroke-width="1.3" x1="180" y1="103" x2="180" y2="115"/>
<polygon points="175,115 185,115 180,121" fill="#888"/>
<text class="sub" x="180" y="113" text-anchor="middle">dec niezależnie na każdym elemencie</text>

<line stroke="#888" stroke-width="1.3" x1="540" y1="103" x2="540" y2="115"/>
<polygon points="535,115 545,115 540,121" fill="#888"/>
<text class="sub" x="540" y="113" text-anchor="middle">dec na każdym, wyniki łączone sekwencyjnie</text>

<!-- Output left: [ Just 0, Just 1, Just 2 ] — list outside, Just inside -->
<rect class="b-list" x="40"  y="123" width="280" height="30" rx="4"/>
<text class="mono" x="180" y="143" text-anchor="middle">
  [<tspan fill="#1E8449"> Just 0</tspan>,<tspan fill="#1E8449"> Just 1</tspan>,<tspan fill="#1E8449"> Just 2</tspan> ]
</text>

<!-- Output right: Just [ 0, 1, 2 ] — Just outside, list inside -->
<rect class="b-just" x="400" y="123" width="280" height="30" rx="4"/>
<text class="mono" x="540" y="143" text-anchor="middle">
  <tspan fill="#1E8449">Just</tspan> [<tspan fill="#2471A3"> 0, 1, 2 </tspan>]
</text>

<!-- Type annotations -->
<text class="ann" x="180" y="165" text-anchor="middle" fill="#2471A3">:: [Maybe Int]  =  t (f b)</text>
<text class="sub" x="180" y="177" text-anchor="middle">efekt wewnątrz kolekcji</text>

<text class="ann" x="540" y="165" text-anchor="middle" fill="#1A5276">:: Maybe [Int]  =  f (t b)</text>
<text class="sub" x="540" y="177" text-anchor="middle">kolekcja wewnątrz efektu</text>

<!-- ══ FAILURE: dec applied to [2, 3, 0] ══ -->

<line class="sep" x1="30" y1="185" x2="690" y2="185"/>
<text class="sub" x="360" y="196" text-anchor="middle">gdy jeden element zawodzi — dec 0 = Nothing:</text>

<!-- Inputs with 0 highlighted -->
<rect class="b-inp" x="40"  y="202" width="280" height="30" rx="4"/>
<text class="mono" x="180" y="222" text-anchor="middle">[ 2, 3, <tspan fill="#C0392B">0</tspan> ]</text>

<rect class="b-inp" x="400" y="202" width="280" height="30" rx="4"/>
<text class="mono" x="540" y="222" text-anchor="middle">[ 2, 3, <tspan fill="#C0392B">0</tspan> ]</text>

<!-- Arrows -->
<line stroke="#888" stroke-width="1.3" x1="180" y1="233" x2="180" y2="242"/>
<polygon points="175,242 185,242 180,248" fill="#888"/>
<line stroke="#888" stroke-width="1.3" x1="540" y1="233" x2="540" y2="242"/>
<polygon points="535,242 545,242 540,248" fill="#888"/>

<!-- Output failure left: Nothing stays isolated inside list -->
<rect class="b-list" x="40"  y="250" width="280" height="30" rx="4"/>
<text class="mono" x="180" y="270" text-anchor="middle">
  [<tspan fill="#1E8449"> Just 1</tspan>,<tspan fill="#1E8449"> Just 2</tspan>,<tspan fill="#C0392B"> Nothing</tspan> ]
</text>

<!-- Output failure right: Nothing propagates out -->
<rect class="b-noth" x="400" y="250" width="280" height="30" rx="4"/>
<text class="mono" x="540" y="270" text-anchor="middle" fill="#C0392B" font-weight="bold">
  Nothing
</text>

</svg>
